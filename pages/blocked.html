<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearHead</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="wrap" data-clearhead="blocked" data-state="breathe">

    <!-- STATE 1: Breathe -->
    <section class="stage" data-stage="breathe">
      <div class="breath" id="breath">
        <div class="breath-glow"></div>
        <div class="breath-core" id="breathCore">
          <span class="breath-word" id="breathWord">Breathe in</span>
        </div>
      </div>
      <p class="reframe">The urge is a wave. Let it pass.</p>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </section>

    <!-- STATE 2: What's going on? (trigger / affect labeling) -->
    <section class="stage" data-stage="trigger" hidden>
      <p class="prompt">What's going on?</p>
      <div class="chips" id="chips">
        <button type="button">Anxious</button>
        <button type="button">Bored</button>
        <button type="button">Stressed</button>
        <button type="button">Lonely</button>
        <button type="button">Tired</button>
        <button type="button">Just habit</button>
      </div>
    </section>

    <!-- STATE 3: Do one thing instead (replacement routine) -->
    <section class="stage" data-stage="action" hidden>
      <p class="prompt">Do one thing instead.</p>
      <div class="chips" id="actions">
        <button type="button">Step outside</button>
        <button type="button">Drink some water</button>
        <button type="button">10 push-ups</button>
        <button type="button">Text a friend</button>
        <button type="button">Start your next task</button>
      </div>
      <input class="next" id="next" type="text" autocomplete="off"
             placeholder="…or name your own" />
      <p class="why" id="why"></p>
    </section>

    <!-- STATE 4: Acknowledge -->
    <section class="stage" data-stage="done" hidden>
      <div class="done-glyph" aria-hidden="true"></div>
      <p class="done-title">The wave passed.</p>
      <p class="done-sub">Go do it.</p>
      <p class="foot" id="foot"></p>
    </section>

  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
