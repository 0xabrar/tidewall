<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClearHead</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="wrap" data-clearhead="blocked" data-state="intro">

    <!-- STATE 0: Welcome / ease-in -->
    <section class="stage" data-stage="intro">
      <div class="intro-orb" aria-hidden="true"></div>
      <h1 class="intro-title">That was a close one.</h1>
      <p class="intro-sub">Let's take a few slow breaths together and let it pass.</p>
      <button class="begin-btn" id="beginBtn" type="button">Begin breathing</button>
    </section>

    <!-- STATE 1: Breathe -->
    <section class="stage" data-stage="breathe" hidden>
      <div class="breath" id="breathWrap" aria-hidden="true">
        <div class="breath-glow" id="breathGlow"></div>
        <span class="ripple"></span>
        <span class="ripple"></span>
        <span class="ripple"></span>
        <div class="breath-core" id="breathCore"></div>
      </div>
      <!-- The cue word sits OUTSIDE the scaling circle, at fixed size, so the
           type never stretches or blurs while the circle breathes. -->
      <p class="breath-word" id="breathWord">Breathe in</p>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <p class="reframe">The urge is a wave. Let it pass.</p>
      <p class="breath-why" id="breathWhy"></p>
    </section>

    <!-- STATE 2: What's going on? (trigger / affect labeling) -->
    <section class="stage" data-stage="trigger" hidden>
      <p class="prompt">How were you feeling before?</p>
      <div class="chips" id="chips">
        <button type="button">Anxious</button>
        <button type="button">Bored</button>
        <button type="button">Stressed</button>
        <button type="button">Lonely</button>
        <button type="button">Tired</button>
        <button type="button">Just habit</button>
      </div>
      <p class="stage-hint">Naming it takes some of its power away.</p>
    </section>

    <!-- STATE 3: Do one thing instead (replacement routine) -->
    <section class="stage" data-stage="action" hidden>
      <p class="prompt">Do one thing instead.</p>
      <div class="chips" id="actions">
        <button type="button">Step outside</button>
        <button type="button">Drink some water</button>
        <button type="button">10 push-ups</button>
        <button type="button">Text a friend</button>
        <button type="button">Start your next task</button>
      </div>
      <input class="next" id="next" type="text" autocomplete="off"
             placeholder="…or name your own" />
      <p class="why" id="why"></p>
    </section>

    <!-- STATE 4: Acknowledge -->
    <section class="stage" data-stage="done" hidden>
      <div class="done-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6.5 9.5 17 4 11.5" />
        </svg>
      </div>
      <p class="done-title">The wave passed.</p>
      <p class="done-action" id="doneAction"></p>
      <div class="done-stat">
        <span class="done-stat-num" id="doneStatNum">0</span>
        <span class="done-stat-label">urges surfed</span>
      </div>
      <p class="done-reflect">Notice how you feel now.</p>
    </section>

  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
